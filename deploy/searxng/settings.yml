use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - duckduckgo
      - github
      - stackoverflow
      - wikipedia

general:
  debug: false
  instance_name: Jensen Private Search

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  # The container entrypoint overwrites this placeholder from SEARXNG_SECRET.
  secret_key: ultrasecretkey
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
  pool_connections: 20
  pool_maxsize: 10

plugins:
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
