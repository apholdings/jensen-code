name: Deterministic Evaluation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-fast:
    name: Linux deterministic evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build evaluator
        run: npm run build
      - name: Validate scenario packs
        run: node packages/coding-agent/dist/cli.js eval validate --json
      - name: Run deterministic safety and runtime packs
        run: |
          node packages/coding-agent/dist/cli.js eval run core-runtime --mode fixture --json
          node packages/coding-agent/dist/cli.js eval run safe-execution --mode fixture --json
          node packages/coding-agent/dist/cli.js eval run todo-recovery --mode fixture --json
          node packages/coding-agent/dist/cli.js doctor eval --json

  evaluation-windows:
    name: Windows deterministic evaluation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build evaluator
        run: npm run build
      - name: Validate and run cross-platform pack
        run: |
          node packages/coding-agent/dist/cli.js eval validate --json
          node packages/coding-agent/dist/cli.js eval run cross-platform --mode fixture --json
          node packages/coding-agent/dist/cli.js doctor eval --json
