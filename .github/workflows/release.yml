name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Ensure npm version for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install Dependencies
        run: npm ci

      - name: Validate (build + check + deterministic tests)
        run: npm run validate

      - name: Evaluate release quality gates
        run: |
          evaluation_tmp="$(mktemp -d)"
          trap 'rm -rf "$evaluation_tmp"' EXIT
          (
            cd "$evaluation_tmp"
            node "$GITHUB_WORKSPACE/packages/coding-agent/dist/cli.js" eval validate --json
            node "$GITHUB_WORKSPACE/packages/coding-agent/dist/cli.js" eval run core-runtime --mode fixture --json > core.json
            node "$GITHUB_WORKSPACE/packages/coding-agent/dist/cli.js" eval run safe-execution --mode fixture --json > safety.json
            node "$GITHUB_WORKSPACE/packages/coding-agent/dist/cli.js" eval run todo-recovery --mode fixture --json > todo.json
            ids="$(node -e 'const fs=require("node:fs"); const files=["core.json","safety.json","todo.json"]; const ids=files.flatMap((file)=>JSON.parse(fs.readFileSync(file,"utf8")).artifacts.map((item)=>item.artifactId)); process.stdout.write(ids.join(" "));')"
            node "$GITHUB_WORKSPACE/packages/coding-agent/dist/cli.js" eval gate check $ids --json
            node "$GITHUB_WORKSPACE/packages/coding-agent/dist/cli.js" doctor eval --json
          )

      - name: Verify pre-release provenance identity
        run: |
          cat > /tmp/release-provenance.json <<EOF
          {"releaseCommit":"${GITHUB_SHA}","versionCommit":"${GITHUB_SHA}","tagCommit":"${GITHUB_SHA}","githubReleaseCommit":"${GITHUB_SHA}","binaryManifestCommit":"${GITHUB_SHA}"}
          EOF
          npm run verify:release-provenance -- /tmp/release-provenance.json

      - name: Create Release Pull Request or prepare release state
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version:packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
          JENSEN_NPM_PUBLISH_AUTH_MODE: ${{ vars.JENSEN_NPM_PUBLISH_AUTH_MODE || 'auto' }}
          JENSEN_NPM_DIST_TAG: ${{ vars.JENSEN_NPM_DIST_TAG || 'fork' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          rm -f "$HOME/.npmrc"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$HOME/.npmrc"
          fi
          node scripts/publish-unpublished-packages.mjs 2>&1 | tee publish-output.txt
          # Extract the release tag from the structured output and propagate
          # it to the downstream push step via GITHUB_OUTPUT.
          node scripts/extract-publish-result.mjs

      - name: Push release tag
        if: steps.publish.outputs.release_tag != ''
        run: git push origin "${{ steps.publish.outputs.release_tag }}"
